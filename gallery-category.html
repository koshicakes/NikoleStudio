<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Nikole Studio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Playfair+Display&family=DM+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
<nav>
    <a href="home.html" class="logo" aria-label="Nikole Studio Home"><img src="nikole red no bg.png" alt="Nikole Studio"></a>
    <button class="nav-toggle" aria-expanded="false" aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="gallery.html" class="is-active">Gallery</a>
        <a href="services.html">Services</a>
        <a href="setup.html">Customize the Space</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html" class="nav-cta">Booking</a>
    </div>
</nav>

<main>
    <section class="hero-minimal">
        <div class="hero-minimal-inner">
            <span class="hero-minimal-eyebrow" id="category-eyebrow">Gallery</span>
            <h1 class="hero-minimal-title" id="category-title">Loading...</h1>
            <p class="hero-minimal-description" id="category-description"></p>
            <div class="hero-minimal-actions">
                <a id="book-now-link" href="booking.html" class="btn-minimal-primary">Book session</a>
                <a href="gallery.html" class="btn-minimal-secondary">Back to gallery</a>
            </div>
        </div>
    </section>

    <section class="page-section gallery-category-section">
        <div class="category-panel">
            <div class="category-detail-card">
                <p class="eyebrow">See albums / shots</p>
                <h2 class="section-title" id="category-detail-title"></h2>
                <p class="category-text" id="category-detail-copy"></p>
            </div>
        </div>

        <!-- Loading state -->
        <div id="category-loading" style="text-align:center;padding:4rem 0;color:#9a7a7a;">
            Loading photos...
        </div>

        <div class="category-grid" id="category-grid" style="display:none;">
            <!-- Inserted by JS -->
        </div>

        <!-- Empty state -->
        <div id="category-empty" style="display:none;text-align:center;padding:4rem 0;color:#9a7a7a;">
            No photos in this category yet. Check back soon.
        </div>
    </section>
</main>

<!-- Lightbox overlay -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem;">
    <button id="lightbox-close" style="position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1;" aria-label="Close">&times;</button>
    <button id="lightbox-prev" style="position:absolute;left:1.5rem;background:none;border:none;color:#fff;font-size:2.5rem;cursor:pointer;line-height:1;" aria-label="Previous">&#8249;</button>
    <button id="lightbox-next" style="position:absolute;right:1.5rem;background:none;border:none;color:#fff;font-size:2.5rem;cursor:pointer;line-height:1;" aria-label="Next">&#8250;</button>
    <img id="lightbox-img" src="" alt="" style="max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;">
    <p id="lightbox-caption" style="color:rgba(255,255,255,0.7);font-size:0.875rem;letter-spacing:1px;"></p>
</div>

<footer class="page-footer">
    <p>&copy; 2026 Nikole Studio.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script src="base.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const params   = new URLSearchParams(window.location.search);
    const category = decodeURIComponent(params.get('category') || '');

    const CATEGORY_META = {
        'Self Portrait Packages': {
            eyebrow:     'Self Portrait Packages',
            title:       'Self Portrait Sessions',
            description: 'Intimate, elegant, and timeless. Just you, the light, and your story.',
            detail:      'A refined selection of self-directed portraits — solo, couple, and small group sessions inside the studio.',
            service:     'Self Portrait Packages'
        },
        'Mini Session Portrait Packages': {
            eyebrow:     'Mini Session Portrait Packages',
            title:       'Mini Session Portraits',
            description: 'Professional portraits with edited high-resolution files, done in 30–120 minutes.',
            detail:      'Quick, polished professional portrait sessions for individuals and small groups.',
            service:     'Mini Session Portrait Packages'
        },
        'Mini Session Family Packages': {
            eyebrow:     'Mini Session Family Packages',
            title:       'Family Portraits',
            description: 'Warm, connected family portraits with framed prints and edited files.',
            detail:      'Family sessions with beautiful prints — from intimate 1-3 pax to large family groups.',
            service:     'Mini Session Family Packages'
        },
        'Peekaboo Sessions': {
            eyebrow:     'Pre-Birthday Packages',
            title:       'Peekaboo Sessions',
            description: 'Celebrate your milestone with dreamy, joyful pre-birthday portraits.',
            detail:      'Creative themes, playful setups, and joyful energy — perfect for your countdown to the big day.',
            service:     'Peekaboo Sessions'
        },
        'Bump & Bliss Sessions': {
            eyebrow:     'Maternity Packages',
            title:       'Bump & Bliss Sessions',
            description: 'Glowing maternity portraits for solo, couple, and family sessions.',
            detail:      'Beautiful maternity photography that celebrates this precious chapter of life.',
            service:     'Bump & Bliss Sessions'
        },
        'Snuggle Sessions': {
            eyebrow:     'Newborn Packages',
            title:       'Snuggle Sessions',
            description: "Your baby's first studio portraits — soft, safe, and beautifully captured.",
            detail:      'Gentle newborn sessions designed around baby\'s mood, comfort, and family connection.',
            service:     'Snuggle Sessions'
        },
        'Event Photo & Video Packages': {
            eyebrow:     'Event Coverage',
            title:       'Event Photo & Video',
            description: 'Full photo and video coverage for birthdays, launches, and celebrations.',
            detail:      'Professional event coverage packages — from 50-guest intimate events to 120+ pax celebrations.',
            service:     'Event Photo & Video Packages'
        }
    };

   
    const STATIC_FALLBACK = {
        'Self Portrait Packages':         ['ak.jpg','a.jpg','a5.jpg','as.jpg','a2.jpg','ak.jpg'],
        'Mini Session Portrait Packages': ['a.jpg','a5.jpg','ak.jpg','as.jpg','a2.jpg','a.jpg'],
        'Mini Session Family Packages':   ['a2.jpg','as.jpg','a.jpg','ak.jpg','a5.jpg','a2.jpg'],
        'Peekaboo Sessions':              ['a2.jpg','ak.jpg','a.jpg','a5.jpg','as.jpg','a2.jpg'],
        'Bump & Bliss Sessions':          ['as.jpg','a2.jpg','ak.jpg','a.jpg','a5.jpg','as.jpg'],
        'Snuggle Sessions':               ['a5.jpg','a.jpg','a2.jpg','ak.jpg','as.jpg','a5.jpg'],
        'Event Photo & Video Packages':   ['as.jpg','a5.jpg','a.jpg','a2.jpg','ak.jpg','as.jpg']
    };

    const meta = CATEGORY_META[category] || {
        eyebrow:     'Gallery',
        title:       category || 'Gallery',
        description: 'A curated look inside Nikole Studio.',
        detail:      'Browse our portfolio of professional photography sessions.',
        service:     category || ''
    };

    document.title = meta.title + ' | Nikole Studio';
    document.getElementById('category-eyebrow').textContent      = meta.eyebrow;
    document.getElementById('category-title').textContent        = meta.title;
    document.getElementById('category-description').textContent  = meta.description;
    document.getElementById('category-detail-title').textContent = meta.title;
    document.getElementById('category-detail-copy').textContent  = meta.detail;

    const bookLink = document.getElementById('book-now-link');
    if (bookLink && meta.service) {
        bookLink.href = `booking.html?service=${encodeURIComponent(meta.service)}`;
    }

    let photos = [];
    try {
        const { data, error } = await nikoleDB
            .from('gallery')
            .select('id, image_url, category, description')
            .eq('category', category)
            .order('id', { ascending: false });
        if (error) throw error;
        photos = data || [];
    } catch (err) {
        console.warn('Category photos load failed, using static fallback:', err.message);
        photos = null; // null = use static
    }

    // ── Render grid ───────────────────────────────────────────────
    const loadingEl = document.getElementById('category-loading');
    const gridEl    = document.getElementById('category-grid');
    const emptyEl   = document.getElementById('category-empty');

    loadingEl.style.display = 'none';

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = String(text || '');
        return d.innerHTML;
    }

    if (photos === null) {
        // DB failed — use static fallback
        const fallbackImgs = STATIC_FALLBACK[category] || ['a.jpg','a2.jpg','ak.jpg'];
        gridEl.innerHTML = fallbackImgs.map((src, i) => `
            <div class="gallery-card category-gallery-card" data-index="${i}">
                <img src="${src}" alt="${escapeHtml(meta.title)} photo ${i+1}" loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400?text=Photo'">
            </div>
        `).join('');
        gridEl.style.display = '';
    } else if (photos.length === 0) {
        emptyEl.style.display = '';
    } else {
        gridEl.innerHTML = photos.map((photo, i) => `
            <div class="gallery-card category-gallery-card" data-index="${i}">
                <img src="${photo.image_url || 'https://via.placeholder.com/400?text=Photo'}"
                     alt="${escapeHtml(photo.description || meta.title)}"
                     loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400?text=Photo'">
                ${photo.description ? `<div class="gallery-card__label"><h4>${escapeHtml(photo.description)}</h4></div>` : ''}
            </div>
        `).join('');
        gridEl.style.display = '';
    }

    // ── Lightbox ──────────────────────────────────────────────────
    const lightbox    = document.getElementById('lightbox');
    const lbImg       = document.getElementById('lightbox-img');
    const lbCaption   = document.getElementById('lightbox-caption');
    const lbClose     = document.getElementById('lightbox-close');
    const lbPrev      = document.getElementById('lightbox-prev');
    const lbNext      = document.getElementById('lightbox-next');
    let   currentIdx  = 0;

    function getCards() { return Array.from(gridEl.querySelectorAll('.category-gallery-card')); }

    function openLightbox(idx) {
        const cards = getCards();
        if (!cards[idx]) return;
        currentIdx = idx;
        const img = cards[idx].querySelector('img');
        const cap = cards[idx].querySelector('.gallery-card__label h4');
        lbImg.src             = img?.src || '';
        lbImg.alt             = img?.alt || '';
        lbCaption.textContent = cap?.textContent || '';
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        document.body.style.overflow = '';
    }

    function showPrev() { const cards = getCards(); openLightbox((currentIdx - 1 + cards.length) % cards.length); }
    function showNext() { const cards = getCards(); openLightbox((currentIdx + 1) % cards.length); }

    gridEl.addEventListener('click', e => {
        const card = e.target.closest('.category-gallery-card');
        if (card) openLightbox(Number(card.dataset.index));
    });

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', showPrev);
    lbNext.addEventListener('click', showNext);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
        if (lightbox.style.display !== 'flex') return;
        if (e.key === 'Escape')      closeLightbox();
        if (e.key === 'ArrowLeft')   showPrev();
        if (e.key === 'ArrowRight')  showNext();
    });
});
</script>
</body>
</html>
